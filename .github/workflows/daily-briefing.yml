name: Daily Mobility Briefing

on:
  schedule:
    # 월~금 한국시간 오전 8시 (UTC 23:00 전날 일~목)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # 수동 실행 가능

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 발송 이력 파일을 캐싱하여 중복 발송 방지 (URL + 주제 중복 체크용)
      - name: Restore sent history cache
        uses: actions/cache@v4
        with:
          path: data/sent_history.json
          # 매일 새 캐시 생성, 이전 캐시가 있으면 복원
          key: sent-history-${{ github.run_id }}
          restore-keys: |
            sent-history-

      - name: Run Mobility Insight Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python main.py
